[package]
name = "fi-accel-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for fi-accel acceleration library"

[lib]
name = "fi_accel"
crate-type = ["cdylib"]

[dependencies]
fi-accel-core = { path = "../fi-accel-core", features = ["tokenizer", "simd", "chunker"] }
pyo3 = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }

[features]
default = []
