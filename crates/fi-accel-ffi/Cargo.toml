[package]
name = "fi-accel-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C FFI bindings for fi-accel-core (Go/C/C++ interop)"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
fi-accel-core = { path = "../fi-accel-core", features = ["tokenizer"] }
serde_json = "1"

[build-dependencies]
cbindgen = "0.27"

[features]
default = ["tokenizer", "embedding", "diff"]
tokenizer = []
embedding = []
diff = []
